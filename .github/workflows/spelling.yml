name: Spelling

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  typos:
      name: "Spell check"
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        - uses: crate-ci/typos@3bc303c295c081add5df4a4d52a1e117f2fb2dce # master
          with:
            files: .
            config: ./.github/workflows/config/typos.toml
