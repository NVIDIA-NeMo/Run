name: Spelling

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  typos:
      name: "Spell check"
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        - uses: crate-ci/typos@3bc303c295c081add5df4a4d52a1e117f2fb2dce # master
          with:
            files: .
            config: ./.github/workflows/config/typos.toml
