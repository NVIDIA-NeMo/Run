name: "Build, validate, and release NeMo Run"

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - "main"
      - "pull-request/**"
      - "[rv][0-9]+.[0-9]+.[0-9]+"
      - "[rv][0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "deploy-release/*"
  workflow_dispatch:
    inputs:
      release-ref:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      dry-run:
        description: Compute the release but do not publish wheel, GH release, or docs.
        required: true
        default: true
        type: boolean
      generate-changelog:
        description: Generate changelog
        required: false
        default: true
        type: boolean
      publish-docs:
        description: Publish docs
        required: false
        default: true
        type: boolean
      version-bump-branch:
        type: string
        required: true
        description: Branch to target for version bump

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  release-workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout workflow and regression tests
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run offline release regression tests
        run: |
          python -m venv .venv-release-tests
          .venv-release-tests/bin/python -m pip install PyYAML==6.0.3
          .venv-release-tests/bin/python -m unittest discover -s .github/tests -p 'test_*workflow.py' -v

  validate-inputs:
    if: |
      !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate immutable release ref
        env:
          RELEASE_REF: ${{ inputs.release-ref || github.sha }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-ref must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Verify manual release source and target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.version-bump-branch }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Dispatch releases from main."
            exit 1
          fi
          if [[ "$TARGET_BRANCH" != main && ! "$TARGET_BRANCH" =~ ^[rv][0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Select main or a versioned Run release branch."
            exit 1
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" --jq 'select(.protected) | .commit.sha')
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The release target must be protected."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_REF...$tip" --jq '.status' | grep -Ex 'ahead|identical'

  bump:
    needs: [validate-inputs, release-workflow-tests]
    if: |
      !cancelled() && !failure() && needs.validate-inputs.result == 'success'
      && needs.release-workflow-tests.result == 'success'
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_bump.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      python-package: nemo_run
      library-name: NeMo Run
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      version-bump-branch: ${{ inputs.version-bump-branch || github.ref_name }}
      release-environment: run-release
      release-branch-pattern: "[rv][0-9]*.[0-9]*.[0-9]*"
      packaging: setuptools
      restrict-to-admins: true

  build-wheel:
    needs: [bump]
    if: |
      !cancelled() && !failure() && needs.bump.result == 'success'
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_build_test_wheel.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      python-package: nemo_run
      python-version: "3.10"
      packaging: setuptools
      ref: ${{ inputs.release-ref || github.sha }}

  publish-wheel:
    needs: build-wheel
    if: >-
      ${{ !cancelled() && !failure() && needs.build-wheel.result == 'success'
          && github.event_name == 'workflow_dispatch' && !inputs.dry-run
          && github.repository == 'NVIDIA-NeMo/Run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build-wheel.outputs.pypi-name }}/
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-wheel.outputs.artifact-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  finalize:
    needs: [bump, build-wheel, publish-wheel]
    if: |
      !cancelled() && !failure() && needs.bump.result == 'success'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.dry-run || needs.publish-wheel.result == 'success')
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_finalize.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      library-name: NeMo Run
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      release-environment: run-release
      gh-release-use-changelog-builder: ${{ inputs.generate-changelog || false }}
      publish-docs: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs }}
      docs-target-path: nemo/run
      release-version: ${{ needs.bump.outputs.release-version || needs.build-wheel.outputs.version }}
      pypi-name: ${{ needs.build-wheel.outputs.pypi-name }}
    secrets:
      AWS_ASSUME_ROLE_ARN: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.AWS_ASSUME_ROLE_ARN || '' }}
      AWS_ACCESS_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      AKAMAI_HOST: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.AKAMAI_HOST || '' }}
      AKAMAI_CLIENT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.AKAMAI_CLIENT_TOKEN || '' }}
      AKAMAI_CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.AKAMAI_CLIENT_SECRET || '' }}
      AKAMAI_ACCESS_TOKEN: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.AKAMAI_ACCESS_TOKEN || '' }}
      S3_BUCKET_NAME: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-docs && secrets.S3_BUCKET_NAME || '' }}

  rehearse-docs:
    needs: [bump, build-wheel]
    if: github.event_name != 'workflow_dispatch' || (inputs.dry-run && inputs.publish-docs)
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_build_docs.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      ref: ${{ inputs.release-ref || github.sha }}

  release-summary:
    needs: [release-workflow-tests, validate-inputs, bump, build-wheel, publish-wheel, finalize, rehearse-docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check release results
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUBLISH_EXPECTED: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
          RELEASE_SKIPPED: "false"
        run: |
          jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<< "$NEEDS"
          if [[ "$RELEASE_SKIPPED" == "true" ]]; then
            exit 0
          fi
          jq -e '[.["release-workflow-tests"], .["validate-inputs"], .bump, .["build-wheel"], .finalize] | all(.[]; .result == "success")' <<< "$NEEDS"
          if [[ "$PUBLISH_EXPECTED" == "true" ]]; then
            jq -e '.["publish-wheel"].result == "success"' <<< "$NEEDS"
          else
            jq -e '.["publish-wheel"].result == "skipped"' <<< "$NEEDS"
          fi
