name: "Code freeze"

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Type of release
        options:
          - major
          - minor
      freeze-commit:
        type: string
        description: Commit SHA to use for cut-off
        required: false
        default: main
      dry-run:
        type: boolean
        description: Dry-run of code-freeze
        required: false
        default: true
permissions:
  contents: read

jobs:
  code-freeze:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_code_freeze.yml@493e7ad25cbbd9467e606fde716f5d3353ebed17 # github app authentication
    with:
      app-id: ${{ vars.BOT_ID }}
      environment-name: main
      library-name: NeMo Run
      python-package: nemo_run
      release-type: ${{ inputs.release-type }}
      freeze-commit: ${{ inputs.freeze-commit }}
      dry-run: ${{ inputs.dry-run }}
      next-pre-release: ""
      next-dev: ""
      packaging: hatch
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_ENDPOINT }}
      SLACK_WEBHOOK_ADMIN: ${{ secrets.SLACK_WEBHOOK_ADMIN }}
      BOT_KEY: ${{ secrets.BOT_KEY }}
