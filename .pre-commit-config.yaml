repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.6.1
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/NVIDIA-NeMo/FW-CI-templates
  rev: 1ebb754bdbe6680cce2b3d81da4e63be7200380a
  hooks:
    - id: guardwords-check
