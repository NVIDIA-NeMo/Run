instances:
  - url: https://nemo-run.docs.buildwithfern.com/nemo/run
    custom-domain: docs.nvidia.com/nemo/run
    multi-source: true


title: nemo run

global-theme: nvidia

logo:
  href: /nemo/run/nightly
  right-text: nemo run

navbar-links:
  - type: github
    value: https://github.com/NVIDIA-NeMo/Run

experimental:
  mdx-components:
    - ./components
  basepath-aware: true

versions:
  - display-name: nightly
    path: versions/nightly.yml
    slug: nightly

redirects:
  # Generated by utils/generate_redirects.py — re-run from repo root; see scripts README
  - source: "/nemo/run/index.html"
    destination: "/nemo/run/nightly"
  - source: "/nemo/run/index"
    destination: "/nemo/run/nightly"
  - source: "/nemo/run/nightly/:path*/index.html"
    destination: "/nemo/run/nightly/:path*"
  - source: "/nemo/run/:path*/index.html"
    destination: "/nemo/run/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/nemo/run/:path*.html"
    destination: "/nemo/run/:path*"
